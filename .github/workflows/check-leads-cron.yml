name: Check leads every 2 hours

on:
  schedule:
    # Har 2 soatda (UTC). Toshkent = UTC+5.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call check-leads endpoint
        run: |
          curl -sS -X GET "https://${{ secrets.VERCEL_DOMAIN }}/api/cron/check-leads?secret=${{ secrets.CRON_SECRET }}"
